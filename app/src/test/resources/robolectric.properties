# Todos os testes Robolectric usam uma Application de teste que NÃO roda o bootstrap em background
# do KalendrysApp.onCreate (appScope: reschedule + collects infinitos). Sem isso, essas corrotinas
# vazam e estouram no Room já fechado entre testes, surgindo como UncaughtExceptionsBeforeTest e
# deixando a suíte flaky. Ver TestKalendrysApp.
application=com.kalendrys.app.testutil.TestKalendrysApp
