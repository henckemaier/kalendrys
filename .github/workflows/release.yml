# Workflow de release do Kalendrys.
#
# COMO PUBLICAR UM RELEASE (ver tambem docs/VERSIONING.md e docs/RELEASING.md):
#   1. Edite SOMENTE `appVersionName` em app/build.gradle.kts (SemVer MAJOR.MINOR.PATCH).
#      O versionCode e derivado pela formula MAJOR*10000 + MINOR*100 + PATCH automaticamente.
#   2. Commit numa branch -> PR -> merge na main (gate do dono do repo).
#   3. git tag v<versionName>  &&  git push origin v<versionName>   (ex.: v1.2.0)
#   O push da tag v* dispara este workflow, que valida, builda ASSINADO e cria o Release.
#
# SECRETS necessarios (Settings > Secrets and variables > Actions):
#   KALENDRYS_UPLOAD_KEYSTORE_BASE64  -> a keystore de upload (.jks) em base64
#   KALENDRYS_UPLOAD_STORE_PASSWORD   -> senha do store
#   KALENDRYS_UPLOAD_KEY_ALIAS        -> alias da chave
#   KALENDRYS_UPLOAD_KEY_PASSWORD     -> senha da chave
# A keystore e as senhas NUNCA sao commitadas; sao decodificadas so em runtime do CI.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # necessario para criar o GitHub Release e anexar o APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validar tag == v + versionName e derivar versionCode
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME=$(grep -E '^val appVersionName = ' app/build.gradle.kts \
            | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::nao consegui extrair appVersionName de app/build.gradle.kts"; exit 1
          fi
          EXPECTED_TAG="v${VERSION_NAME}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::tag '$TAG' != v+versionName '$EXPECTED_TAG'. Faca bump do appVersionName e tague v<versionName>."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "EXPECTED_CODE=$EXPECTED_CODE" >> "$GITHUB_ENV"
          echo "OK: tag=$TAG versionName=$VERSION_NAME versionCode(esperado)=$EXPECTED_CODE"

      - name: Decodificar keystore de upload (base64) dos secrets
        env:
          KEYSTORE_B64: ${{ secrets.KALENDRYS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::secret KALENDRYS_UPLOAD_KEYSTORE_BASE64 ausente"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "KALENDRYS_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build assembleRelease ASSINADO (signingConfig "upload")
        env:
          KALENDRYS_UPLOAD_STORE_PASSWORD: ${{ secrets.KALENDRYS_UPLOAD_STORE_PASSWORD }}
          KALENDRYS_UPLOAD_KEY_ALIAS: ${{ secrets.KALENDRYS_UPLOAD_KEY_ALIAS }}
          KALENDRYS_UPLOAD_KEY_PASSWORD: ${{ secrets.KALENDRYS_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Localizar APK e validar versionCode/versionName vs formula (aapt)
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::APK de release nao encontrado"; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CODE=$("$BT/aapt" dump badging "$APK" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")
          NAME=$("$BT/aapt" dump badging "$APK" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")
          echo "APK=$APK versionName=$NAME versionCode=$CODE (esperado name=$VERSION_NAME code=$EXPECTED_CODE)"
          if [ "$CODE" != "$EXPECTED_CODE" ] || [ "$NAME" != "$VERSION_NAME" ]; then
            echo "::error::versionCode/versionName do APK ($NAME/$CODE) nao batem com a formula ($VERSION_NAME/$EXPECTED_CODE)"
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Criar GitHub Release e anexar o APK assinado
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
