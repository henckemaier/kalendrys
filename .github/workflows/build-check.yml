# Build-check do Kalendrys: roda em todo PR para a main (e manualmente).
#
# Espelha o release.yml (ver docs/RELEASING.md) no que importa para o build: mesmo runner, mesmos
# actions com os mesmos SHAs, mesmo JDK, o mesmo :app:assembleRelease e a mesma conferencia do
# versionName/versionCode pela formula via aapt. Assim, verde aqui = o release da tag builda igual.
# Mantenha os dois workflows comparaveis lado a lado: mudou preparo/JDK/actions em um, mude no outro.
#
# Diferencas em relacao ao release.yml:
#   - sem tag: valida so versionName -> versionCode pela formula (sem comparar com GITHUB_REF);
#   - SEM secrets/keystore: sem a chave de upload, o build.gradle.kts assina o release com a chave
#     de debug do runner (signingConfig "debug"); o APK nao e publicado nem anexado;
#   - a mesma invocacao do Gradle roda tambem a suite de testes unitarios (:app:testDebugUnitTest)
#     e o lint (:app:lintDebug), aproveitando a configuracao; falha de teste ou erro de lint
#     derruba o PR (relatorios so no log do job);
#   - confere os construtores mantidos pelas regras keep do R8 (scripts/check-r8-keep-constructors.sh);
#   - permissions so de leitura; sem upload-artifact.

name: Build check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Derivar versionCode do versionName (sem tag)
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E '^val appVersionName = ' app/build.gradle.kts \
            | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::nao consegui extrair appVersionName de app/build.gradle.kts"; exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "EXPECTED_CODE=$EXPECTED_CODE" >> "$GITHUB_ENV"
          echo "OK: versionName=$VERSION_NAME versionCode(esperado)=$EXPECTED_CODE"

      # Uma so invocacao: testes, lint e o mesmo assembleRelease do release.yml.
      - name: Testes, lint e assembleRelease (sem secrets; assina com a chave de debug)
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --stacktrace

      # Só no build-check: prova no log quais suítes rodaram (inclusive as de GraphicsMode NATIVE,
      # que dependem da biblioteca nativa do Robolectric no Linux) e o total do lint. Só shell, lendo
      # os relatórios que o passo anterior gerou; roda mesmo se ele falhou, para mostrar onde.
      - name: Resumo dos testes e do lint
        if: always()
        run: |
          set -uo pipefail
          DIR=app/build/test-results/testDebugUnitTest
          attr() { sed -nE "0,/<testsuite /s/.*<testsuite [^>]*\b$1=\"([^\"]*)\".*/\1/p" "$2"; }
          if ls "$DIR"/TEST-*.xml >/dev/null 2>&1; then
            printf '%-80s %6s %6s %6s %6s\n' SUITE TESTES FALHAS ERROS PULADOS
            T=0; F=0; E=0; S=0
            for f in "$DIR"/TEST-*.xml; do
              n=$(attr name "$f"); t=$(attr tests "$f"); fa=$(attr failures "$f"); e=$(attr errors "$f"); s=$(attr skipped "$f")
              printf '%-80s %6s %6s %6s %6s\n' "$n" "$t" "$fa" "$e" "$s"
              T=$((T + t)); F=$((F + fa)); E=$((E + e)); S=$((S + s))
            done
            echo "TOTAL: $(ls "$DIR"/TEST-*.xml | wc -l) suites, $T testes, $F falhas, $E erros, $S pulados"
          else
            echo "::warning::sem relatorios de teste em $DIR"
          fi
          LINT=app/build/reports/lint-results-debug.xml
          if [ -f "$LINT" ]; then
            echo "LINT: $(grep -cE 'severity="(Error|Fatal)"' "$LINT") erros, $(grep -c 'severity="Warning"' "$LINT") avisos"
          else
            echo "::warning::sem relatorio do lint em $LINT"
          fi

      - name: Localizar APK e validar versionCode/versionName vs formula (aapt)
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::APK de release nao encontrado"; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CODE=$("$BT/aapt" dump badging "$APK" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p")
          NAME=$("$BT/aapt" dump badging "$APK" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")
          echo "APK=$APK versionName=$NAME versionCode=$CODE (esperado name=$VERSION_NAME code=$EXPECTED_CODE)"
          if [ "$CODE" != "$EXPECTED_CODE" ] || [ "$NAME" != "$VERSION_NAME" ]; then
            echo "::error::versionCode/versionName do APK ($NAME/$CODE) nao batem com a formula ($VERSION_NAME/$EXPECTED_CODE)"
            exit 1
          fi

      # Só no build-check (não espelha o release.yml): classe mantida por regra keep cujo construtor
      # sem argumentos o R8 removeu (modo estrito do AGP 9; bloqueante da v1.6.2). Cruza o usage.txt
      # e o seeds.txt que o R8 já gerou no passo de build; exceções em app/r8-keep-ctor-exceptions.txt.
      - name: Conferir construtores mantidos pelas regras keep (R8)
        run: bash scripts/check-r8-keep-constructors.sh
